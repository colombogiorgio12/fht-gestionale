<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<title>FHT Tracker</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns='http://www.w3.org/2000/svg' viewBox='0 0 32 32'%3E%3Crect width='32' height='32' rx='8' fill='%23B9F03C'/%3E%3Ctext x='16' y='22' font-family='Arial' font-weight='700' font-size='17' text-anchor='middle' fill='%23132000'%3EF%3C/text%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&display=swap">
<style>
/* Layout: fixed left sidebar + main column with a sticky 48px view bar; dense list rows grouped by status; task detail in a right-hand peek panel; ⌘K command palette. */
:root{
  --bg:#FFFFFF; --side:#F7F7F8; --surface:#FFFFFF; --hover:#F0F0F3; --line:#E4E4E8; --line-2:#EEEEF1;
  --ink:#1B1C1F; --ink-2:#3D4047; --muted:#6E727B; --faint:#A0A3AA;
  --accent:#B9F03C; --accent-ink:#132000; --accent-soft:#EEF8D6; --accent-fg:#4A7A0C; --blue:#3E6FD8;
  --red:#D3403F; --red-soft:#FCEBEA; --amber:#C2850C; --amber-soft:#FBF2DE; --green:#2E9A5A; --green-soft:#E3F4EA; --orange:#E5683A;
  --shadow:0 12px 40px rgba(20,20,40,.16),0 2px 6px rgba(20,20,40,.06); --scrim:rgba(15,15,25,.28);
  --f:"Inter", "SF Pro Text", "Segoe UI", system-ui, -apple-system, sans-serif;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#101113; --side:#0B0C0E; --surface:#17181B; --hover:#1E1F23; --line:#26282D; --line-2:#1D1F23;
  --ink:#EDEEF0; --ink-2:#C8CAD0; --muted:#8B8F98; --faint:#5F636B;
  --accent:#C3F550; --accent-ink:#132000; --accent-soft:#25331A; --accent-fg:#C3F550; --blue:#7FA3F5;
  --red:#EB5B57; --red-soft:#3A1E1D; --amber:#F0C24E; --amber-soft:#3A3116; --green:#4FB985; --green-soft:#173426; --orange:#F0804F;
  --shadow:0 16px 48px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.5); color-scheme:dark;
}}
:root[data-theme="dark"]{
  --bg:#101113; --side:#0B0C0E; --surface:#17181B; --hover:#1E1F23; --line:#26282D; --line-2:#1D1F23;
  --ink:#EDEEF0; --ink-2:#C8CAD0; --muted:#8B8F98; --faint:#5F636B;
  --accent:#C3F550; --accent-ink:#132000; --accent-soft:#25331A; --accent-fg:#C3F550; --blue:#7FA3F5;
  --red:#EB5B57; --red-soft:#3A1E1D; --amber:#F0C24E; --amber-soft:#3A3116; --green:#4FB985; --green-soft:#173426; --orange:#F0804F;
  --shadow:0 16px 48px rgba(0,0,0,.6),0 2px 8px rgba(0,0,0,.4); --scrim:rgba(0,0,0,.5); color-scheme:dark;
}
*{box-sizing:border-box}
:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
body{margin:0}
[hidden]{display:none!important}
img{max-width:100%}
html,body{height:100%}
.login{max-width:360px;margin:16vh auto;padding:0 16px;display:flex;flex-direction:column;gap:14px}
.login .ws-logo{width:36px;height:36px;font-size:18px;border-radius:9px}
.login h1{font-size:20px}
.login p{margin:0;color:var(--muted)}
.login form{display:flex;flex-direction:column;gap:10px}
.login label{display:flex;flex-direction:column;gap:4px;font-size:12px;color:var(--muted);font-weight:500}
.login input{height:36px!important;font-size:14px!important;width:100%}
.login .btn{height:36px;justify-content:center}
.login .err{color:var(--red);font-size:13px;min-height:1em}
.secret{font:600 20px ui-monospace,Menlo,monospace;letter-spacing:.06em;padding:12px 14px;border:1px dashed var(--line);border-radius:8px;text-align:center;user-select:all}
body{background:var(--bg);color:var(--ink);font:13.5px/1.45 var(--f);-webkit-font-smoothing:antialiased;font-feature-settings:"cv11","ss01"}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--bg)}
h1,h2,h3{margin:0;font-weight:600;letter-spacing:-.011em;text-wrap:balance}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent-fg);outline-offset:1px}
.ico{display:inline-flex;width:16px;height:16px;flex:none;align-items:center;justify-content:center}
.ico svg{width:100%;height:100%;display:block}
.muted{color:var(--muted)}
.grow{flex:1;min-width:0}
.tnum{font-variant-numeric:tabular-nums}

/* app frame */
.app{display:grid;grid-template-columns:232px minmax(0,1fr);min-height:100%}
.side{position:sticky;top:env(safe-area-inset-top,0px);height:calc(100dvh - env(safe-area-inset-top,0px) - env(safe-area-inset-bottom,0px));background:var(--side);border-right:1px solid var(--line);display:flex;flex-direction:column;gap:1px;padding:10px 8px 10px max(8px,env(safe-area-inset-left,0px));overflow-y:auto;z-index:25}
.ws{display:flex;align-items:center;gap:8px;padding:2px 4px 10px 6px}
.ws-logo{width:22px;height:22px;border-radius:6px;background:var(--accent);color:var(--accent-ink);display:grid;place-items:center;font-weight:700;font-size:12px}
.ws-name{font-weight:600}
.icon-btn{width:28px;height:28px;border:0;background:none;border-radius:6px;color:var(--muted);display:inline-grid;place-items:center;flex:none}
.icon-btn:hover{background:var(--hover);color:var(--ink)}
.nav-sec{font-size:11.5px;font-weight:500;color:var(--faint);padding:14px 10px 4px}
.nav-it{display:flex;align-items:center;gap:9px;height:30px;padding:0 10px;border:0;background:none;border-radius:6px;color:var(--ink-2);text-align:left;width:100%;font-weight:500}
.nav-it .ico{color:var(--muted)}
.nav-it:hover{background:var(--hover)}
.nav-it[aria-current="page"]{background:var(--hover);color:var(--ink)}
.nav-it[aria-current="page"] .ico{color:var(--ink)}
.nav-l{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.nav-b{font-size:11.5px;color:var(--muted);font-variant-numeric:tabular-nums}
.nav-b.red{color:#fff;background:var(--red);border-radius:9px;padding:0 6px;line-height:18px}
.side-foot{margin-top:auto;display:flex;flex-direction:column;gap:1px;padding-top:10px;border-top:1px solid var(--line)}
.me{display:flex;align-items:center;gap:9px;padding:8px 10px}
.me b{display:block;font-weight:500;font-size:13px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.me small{color:var(--muted);font-size:11.5px}
.main{min-width:0;display:flex;flex-direction:column}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:15;height:48px;display:flex;align-items:center;gap:10px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 20px;background:var(--bg);border-bottom:1px solid var(--line)}
.bar h1{font-size:14px;font-weight:600;display:flex;align-items:center;gap:8px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar h1 .ico{color:var(--muted)}
.bar .sub{color:var(--muted);font-size:13px;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.bar-act{margin-left:auto;display:flex;gap:6px;align-items:center;flex:none}
.hamb{display:none}
.filters{display:flex;align-items:center;gap:6px;flex-wrap:wrap;padding:8px max(16px,env(safe-area-inset-right,0px)) 8px 20px;border-bottom:1px solid var(--line)}
.filters input[type=search]{flex:1;min-width:160px;max-width:320px}
.content{padding:20px max(16px,env(safe-area-inset-right,0px)) 48px 20px;display:flex;flex-direction:column;gap:20px;min-width:0}
.content.flush{padding:0 0 48px}
.scrim{display:none}
@media (max-width:820px){
  .app{grid-template-columns:minmax(0,1fr)}
  .side{position:fixed;left:0;top:0;bottom:0;height:auto;width:264px;transform:translateX(-102%);transition:transform .18s ease;padding-top:calc(10px + env(safe-area-inset-top,0px));padding-bottom:calc(10px + env(safe-area-inset-bottom,0px))}
  body.nav-open .side{transform:none;box-shadow:var(--shadow)}
  body.nav-open .scrim{display:block;position:fixed;inset:0;background:var(--scrim);z-index:24}
  .hamb{display:inline-grid}
  .bar{padding-left:max(10px,env(safe-area-inset-left,0px))}
  .filters,.content{padding-left:max(16px,env(safe-area-inset-left,0px))}
  .content.flush{padding-left:0}
}

/* controls */
.btn{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px solid var(--line);background:var(--surface);border-radius:6px;font-weight:500;font-size:13px;color:var(--ink);white-space:nowrap;text-decoration:none}
.btn:hover{background:var(--hover)}
.btn.primary{background:var(--accent);border-color:var(--accent);color:var(--accent-ink)}
.btn.primary:hover{filter:brightness(1.08);background:var(--accent)}
.btn.ghost{border-color:transparent;background:none;color:var(--muted)}
.btn.ghost:hover{background:var(--hover);color:var(--ink)}
.btn.danger{color:var(--red)}
.btn.danger.armed{background:var(--red);border-color:var(--red);color:#fff}
.btn.sm{height:24px;padding:0 8px;font-size:12px}
.btn:disabled{opacity:.5;cursor:not-allowed}
kbd{font:500 11px var(--f);border:1px solid var(--line);border-radius:4px;padding:0 4px;color:var(--muted);background:var(--surface)}
input[type=text],input[type=search],input[type=date],input[type=number],input[type=email],input[type=password],select,textarea{height:28px;background:var(--surface);border:1px solid var(--line);border-radius:6px;padding:0 8px;font-size:13px;max-width:100%;color:var(--ink)}
textarea{height:auto;min-height:70px;padding:8px;resize:vertical;width:100%;line-height:1.5}
select{padding-right:4px}
.seg{display:inline-flex;border:1px solid var(--line);border-radius:6px;overflow:hidden;height:28px}
.seg button{border:0;background:var(--surface);padding:0 10px;color:var(--muted);font-size:12.5px;font-weight:500;display:inline-flex;gap:5px;align-items:center}
.seg button+button{border-left:1px solid var(--line)}
.seg button[aria-pressed="true"]{background:var(--hover);color:var(--ink)}
.toggle{display:inline-flex;align-items:center;gap:6px;height:28px;padding:0 10px;border:1px dashed var(--line);border-radius:6px;background:none;color:var(--muted);font-size:12.5px;font-weight:500}
.toggle[aria-pressed="true"]{border-style:solid;border-color:var(--accent-fg);color:var(--accent-fg);background:var(--accent-soft)}
label.chk{display:inline-flex;gap:6px;align-items:center;color:var(--ink-2);font-size:13px}
.linkbtn{background:none;border:0;color:var(--muted);padding:0;font-size:12px}
.linkbtn:hover{color:var(--ink);text-decoration:underline}

/* atoms */
.av{width:18px;height:18px;border-radius:50%;flex:none;object-fit:cover;display:inline-grid;place-items:center;font-size:9px;font-weight:600;color:#fff;background:var(--faint)}
.av.lg{width:28px;height:28px;font-size:11px}
.av.none{background:none;border:1px dashed var(--faint)}
.avs{display:inline-flex;align-items:center;flex:none}.avs .av{box-shadow:0 0 0 2px var(--bg)}.avs .av+.av{margin-left:-5px}.avs .more{background:var(--line);color:var(--ink-2)}
.picks{display:flex;flex-direction:column;gap:2px;max-height:168px;overflow-y:auto;border:1px solid var(--line);border-radius:6px;padding:4px}
.picks label.chk{padding:3px 6px;border-radius:5px;color:var(--ink)}.picks label.chk:hover{background:var(--hover)}
.tid{color:var(--muted);font-size:12.5px;font-variant-numeric:tabular-nums;flex:none;min-width:54px}
.s-todo{color:var(--muted)} .s-doing{color:var(--amber)} .s-review{color:var(--blue)} .s-done{color:var(--accent-fg)}
.prio{color:var(--muted)} .prio-urgent{color:var(--orange)} .prio-none{color:var(--faint)}
.pill{display:inline-flex;align-items:center;gap:4px;height:20px;padding:0 7px;border-radius:10px;font-size:11.5px;font-weight:500;white-space:nowrap;flex:none}
.r-late{background:var(--red-soft);color:var(--red)}
.r-risk{background:var(--amber-soft);color:var(--amber)}
.q-pending{background:var(--amber-soft);color:var(--amber)} .q-approved{background:var(--green-soft);color:var(--green)} .q-rejected{background:var(--hover);color:var(--muted)}
.on{background:var(--green-soft);color:var(--green)} .off{background:var(--hover);color:var(--muted)}
.chip{display:inline-flex;align-items:center;gap:5px;height:22px;padding:0 8px;border:1px solid var(--line);border-radius:11px;font-size:12px;color:var(--ink-2);max-width:200px;min-width:0;flex:none}
.chip span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.chip .ico{width:12px;height:12px;color:var(--muted)}
.due{display:inline-flex;align-items:center;gap:4px;font-size:12px;color:var(--muted);white-space:nowrap;flex:none;font-variant-numeric:tabular-nums}
.due .ico{width:13px;height:13px}
.due.late{color:var(--red)} .due.soon{color:var(--amber)}
.meta-n{display:inline-flex;align-items:center;gap:3px;font-size:12px;color:var(--muted);font-variant-numeric:tabular-nums;flex:none}
.meta-n .ico{width:13px;height:13px}
.empty{color:var(--muted);padding:28px 20px;text-align:center}
.empty b{display:block;color:var(--ink);font-weight:500;margin-bottom:4px}
.hint{font-size:12.5px;color:var(--muted);margin:0}

/* list rows */
.grp{position:sticky;top:calc(env(safe-area-inset-top,0px) + 48px);z-index:5;display:flex;align-items:center;gap:8px;height:36px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 20px;background:var(--side);border-bottom:1px solid var(--line-2);font-weight:500;width:100%;border-top:0;border-left:0;border-right:0;text-align:left}
.grp .n{color:var(--muted);font-weight:400;font-variant-numeric:tabular-nums}
.grp .chev{color:var(--muted);transition:transform .12s}
.grp[aria-expanded="false"] .chev{transform:rotate(-90deg)}
.trow{display:flex;align-items:center;gap:10px;min-height:40px;padding:0 max(16px,env(safe-area-inset-right,0px)) 0 20px;border-bottom:1px solid var(--line-2);cursor:pointer;min-width:0}
.trow:hover,.trow:focus-visible{background:var(--hover);outline:none}
.trow .ttl{overflow:hidden;text-overflow:ellipsis;white-space:nowrap;font-weight:500;min-width:40px;flex:0 1 auto}
.trow.is-done .ttl{color:var(--muted)}
.trow .spacer{flex:1}
.st-btn{border:0;background:none;padding:2px;border-radius:4px;display:inline-grid;flex:none}
.st-btn:hover{background:var(--line)}
@media (max-width:820px){.grp,.trow{padding-left:max(16px,env(safe-area-inset-left,0px))}}
@media (max-width:640px){.trow .tid,.trow .chip.goal,.trow .meta-n{display:none}.trow{flex-wrap:nowrap}}

/* sections */
.sec{border:1px solid var(--line);border-radius:10px;background:var(--surface);overflow:hidden;min-width:0}
.sec-h{display:flex;align-items:center;gap:8px;min-height:40px;padding:0 14px;border-bottom:1px solid var(--line-2);font-weight:600;font-size:13px;flex-wrap:wrap}
.sec-h .n{color:var(--muted);font-weight:400}
.sec-h .act{margin-left:auto;display:flex;gap:6px}
.sec.alert .sec-h{color:var(--red)}
.lrow{display:flex;align-items:center;gap:10px;min-height:40px;padding:6px 14px;border-bottom:1px solid var(--line-2);min-width:0;flex-wrap:wrap}
.lrow:last-child{border-bottom:0}
.lrow.click{cursor:pointer}
.lrow.click:hover{background:var(--hover)}
.lrow .main-t{flex:1;min-width:160px}
.lrow .main-t b{display:block;font-weight:500;overflow-wrap:anywhere}
.lrow .main-t small{display:block;color:var(--muted);font-size:12px;overflow-wrap:anywhere}
.lrow .acts{display:flex;gap:6px;align-items:center;flex-wrap:wrap}
.grid2{display:grid;grid-template-columns:minmax(0,1.5fr) minmax(0,1fr);gap:20px;align-items:start}
.col{display:flex;flex-direction:column;gap:20px;min-width:0}
@media (max-width:1000px){.grid2{grid-template-columns:minmax(0,1fr)}}
.stats-row{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:12px}
@media (max-width:700px){.stats-row{grid-template-columns:repeat(2,minmax(0,1fr))}}
.stat{border:1px solid var(--line);border-radius:10px;padding:12px 14px;background:var(--surface)}
.stat .n{font-size:22px;font-weight:600;font-variant-numeric:tabular-nums;letter-spacing:-.02em}
.stat .l{color:var(--muted);font-size:12.5px}
.stat.warn .n{color:var(--red)} .stat.soon .n{color:var(--amber)}
.bar-m{height:4px;background:var(--line);border-radius:3px;overflow:hidden;width:80px;flex:none}
.bar-m i{display:block;height:100%;background:var(--accent)}
.ring{width:18px;height:18px;flex:none}
.hello{display:flex;flex-direction:column;gap:2px}
.hello h2{font-size:20px}
.hello p{margin:0;color:var(--muted)}

/* board */
.board{display:grid;grid-template-columns:repeat(4,minmax(240px,1fr));gap:12px;padding:16px max(16px,env(safe-area-inset-right,0px)) 32px 20px;overflow-x:auto;align-items:start}
.bcol{display:flex;flex-direction:column;gap:6px;min-width:0}
.bcol-h{display:flex;align-items:center;gap:8px;height:32px;padding:0 4px;font-weight:500}
.bcol-h .n{color:var(--muted);font-weight:400}
.card{background:var(--surface);border:1px solid var(--line);border-radius:8px;padding:10px 12px;display:flex;flex-direction:column;gap:8px;text-align:left;width:100%;box-shadow:0 1px 2px rgba(0,0,0,.04)}
.card:hover{border-color:var(--faint)}
.card .top{display:flex;align-items:center;gap:8px}
.card .t{font-weight:500;line-height:1.35;overflow-wrap:anywhere}
.card .meta{display:flex;align-items:center;gap:8px;flex-wrap:wrap}
.card.flag-late{box-shadow:inset 0 0 0 1px var(--red)}
.card.flag-risk{box-shadow:inset 0 0 0 1px var(--amber)}
.bempty{color:var(--faint);font-size:12.5px;padding:10px 4px}

/* calendar & timeline */
.scroll{overflow-x:auto;border:1px solid var(--line);border-radius:10px;background:var(--surface)}
.cal{display:grid;grid-template-columns:repeat(7,minmax(100px,1fr));min-width:720px}
.cal .dow{font-size:11.5px;color:var(--muted);padding:8px 10px;border-bottom:1px solid var(--line);font-weight:500}
.cal .day{min-height:108px;border-right:1px solid var(--line-2);border-bottom:1px solid var(--line-2);padding:6px;display:flex;flex-direction:column;gap:3px;min-width:0}
.cal .day:nth-child(7n){border-right:0}
.cal .day.out{background:var(--side)}
.cal .dn{font-size:12px;color:var(--muted);align-self:flex-start;padding:0 5px;border-radius:9px;font-variant-numeric:tabular-nums}
.cal .day.today .dn{background:var(--accent);color:var(--accent-ink)}
.cal .it{display:flex;align-items:center;gap:5px;width:100%;text-align:left;border:0;border-radius:5px;padding:2px 5px;font-size:12px;background:var(--hover);color:var(--ink);min-width:0}
.cal .it span{overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.cal .it .ico{width:12px;height:12px}
.cal .it.late{background:var(--red-soft);color:var(--red)}
.cal .it.risk{background:var(--amber-soft);color:var(--amber)}
.cal .it.done span{text-decoration:line-through;color:var(--muted)}
.cal .it.goal{background:var(--accent-soft);color:var(--accent-fg);font-weight:500}
.g-row{display:grid;grid-template-columns:240px 1fr;border-bottom:1px solid var(--line-2);min-height:36px}
.g-row:last-child{border-bottom:0}
.g-lab{position:sticky;left:0;background:var(--surface);z-index:2;padding:6px 12px;border-right:1px solid var(--line);font-size:12.5px;min-width:0;display:flex;align-items:center;gap:8px}
.g-lab .t{min-width:0;flex:1}
.g-lab b{font-weight:500;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block}
.g-lab small{color:var(--muted);overflow:hidden;text-overflow:ellipsis;white-space:nowrap;display:block;font-size:11.5px}
.g-lab.click{cursor:pointer}
.g-lab.click:hover{background:var(--hover)}
.g-track{position:relative;background-image:linear-gradient(to right,var(--line-2) 1px,transparent 1px);background-size:calc(var(--dw) * 7) 100%}
.g-head .g-lab,.g-head .g-track{background-color:var(--side)}
.g-wk{position:absolute;top:10px;padding-left:5px;white-space:nowrap;font-size:11.5px;color:var(--muted)}

}

  for(const[u,d]of Object.entries(S.work)){const e=d&&d.items&&d.items[t.id];if(!e)continue;
    for(const[c,v]of Object.entries(e.done||{})){const x=v&&typeof v==="object"?v:{v:!!v,at:""};if(!done[c]||(x.at||"")>=(done[c].at||""))done[c]=x}

  if(file.size>50*1048576)throw new Error("“"+file.name+"” is over 50 MB: compress or split it.");
  const fid=uid("f");const safe=file.name.normalize("NFKD").replace(/[^\w.\- ()]+/g,"_").slice(-120)||"file";const path=S.meId+"/"+fid+"/"+safe;
  const{error}=await sb.storage.from(BUCKET).upload(path,file,{upsert:false,contentType:file.type||"application/octet-stream"});
  if(error)throw new Error(/size|large/i.test(error.message)?"“"+file.name+"” is too large.":"Uploading “"+file.name+"” failed: "+error.message);
  await writeItem("files",S.meId,fid,{name:file.name,size:file.size,ext,at:now(),store:"storage",path,...link})}

  const nx=h("input",{type:"date",id:"rf-next",value:tp.next||todayStr()});
  const dd=h("input",{type:"number",id:"rf-days",min:"0",step:"1",value:tp.dueDays??2});
  const est=h("input",{type:"number",id:"rf-est",min:"0",step:"0.5",value:tp.estimate||""});
  const go_=sel("rf-goal",[["","No goal"],...S.goals.map(g=>[g.id,g.title])],tp.goal||"");
  const cl=h("textarea",{id:"rf-check",placeholder:"One item per line"});cl.value=(tp.checklist||[]).map(c=>c.t).join("\n");
  const[act,actL]=chk("rf-active","Active",tp.id?tp.active:true);
  openModal(tp.id?"Edit template":"New recurring task",[title,desc,h("div",{class:"form"},h("label",{},"Frequency",fq),h("label",{},"Next creation",nx),h("label",{},"Days to complete",dd),
    h("label",{class:"full"},"Assigned to (one or more)",as),h("label",{},"Priority",pr),h("label",{},"Estimated hours",est),h("label",{class:"full"},"Goal",go_),h("label",{class:"full"},"Subtasks",cl),actL)],async()=>{
      const body={title:title.value.trim(),desc:desc.value.trim(),...asgPatch(as.value()),priority:pr.value,freq:fq.value,next:nx.value||todayStr(),dueDays:Math.max(0,parseInt(dd.value||"0",10)),
        estimate:est.value?parseFloat(est.value):null,goal:go_.value||null,checklist:linesToChecklist(cl.value,tp.checklist),active:act.checked};
      if(!body.title){toast("Write a title.");return false}
      if(tp.id){const{id,...rest}=tp;await S.db.doc("templates/"+id).set({...rest,...body,updatedAt:now()})}else await S.db.collection("templates").add({...body,createdAt:now(),createdBy:S.meId});
      S.ranTpl=false;toast("Template saved")})}
function memberForm(id){const p=S.people[id]||{};
  const nm=h("input",{type:"text",id:"mf-name",value:p.name||""});
  const role=h("input",{type:"text",id:"mf-role",value:p.title||"",placeholder:"e.g. Research assistant, Student"});
  const grp=h("input",{type:"text",id:"mf-group",value:p.grp||"",placeholder:"e.g. Data collection"});
  const ro=sel("mf-perm",[["collab","Collaborator"],["coord","Group coordinator"]],p.role==="coord"?"coord":"collab");
  const em=h("input",{type:"email",id:"mf-email",value:(S.prefs[id]||{}).email||"",placeholder:p.email||""});
  openModal(nameOf(id),h("div",{class:"form"},h("label",{},"Name",nm),h("label",{},"Role",role),h("label",{},"Group",grp),h("label",{},"Permissions",ro),
    h("label",{class:"two"},"Email for reminders, if different from the sign-in one",em),
    h("p",{class:"hint full"},"The coordinator creates and manages tasks for the people in their group and approves their requests.")),async()=>{
    if(ro.value==="coord"&&!grp.value.trim()){toast("A coordinator needs a group.");return false}
    const{error}=await sb.from("profiles").update({name:nm.value.trim(),title:role.value.trim(),grp:grp.value.trim(),role:ro.value}).eq("id",id);if(error)throw dbErr(error);
    if(em.value.trim()!==((S.prefs[id]||{}).email||""))await savePrefs(id,{email:em.value.trim()});await loadProfiles();toast("Profile updated")})}
function prefsForm(){const pr=S.prefs[S.meId]||{};const days=pr.remind||[1,3];
  const em=h("input",{type:"email",id:"pf-email",value:pr.email||(S.people[S.meId]||{}).email||"",placeholder:"name@example.com"});
  const boxes=REMIND_OPTS.map(([d,l])=>chk("pf-d"+d,l,days.includes(d)));
  const[wk,wkL]=chk("pf-weekly","Summary of my tasks every Monday",pr.weekly!==false);
  openModal("Reminders and email",h("div",{class:"form"},h("label",{class:"full"},"Your email",em),
    h("div",{class:"full",style:"display:flex;flex-direction:column;gap:6px"},h("span",{class:"hint"},"Remind me before deadlines"),...boxes.map(b=>b[1]),wkL),
    h("p",{class:"hint full"},"Reminders appear in Overview based on these choices. Emails are sent by the lead's scheduled task, once sending is enabled.")),async()=>{
      await savePrefs(S.meId,{email:em.value.trim(),remind:REMIND_OPTS.map(o=>o[0]).filter((d,i)=>boxes[i][0].checked),weekly:wk.checked,updatedAt:now()});toast("Preferences saved")})}
function requestForm(type,taskId){
  if(type==="extend"){const mine=S.tasks.filter(t=>isAsg(t,S.meId)&&statusOf(t)!=="done").sort(sortTasks);
    if(!mine.length){toast("You have no open tasks to ask an extension for.");return}
    const ts=sel("rq-task",mine.map(t=>[t.id,tid(t)+" "+t.title+(t.due?" (scade "+fmtDate(t.due,true)+")":"")]),taskId||mine[0].id);
    const nd=h("input",{type:"date",id:"rq-due",required:true});const rs=h("textarea",{id:"rq-reason",placeholder:"What you need and why"});
    openModal("Ask for an extension",h("div",{class:"form"},h("label",{class:"two"},"Task",ts),h("label",{},"New due date",nd),h("label",{class:"full"},"Reason",rs)),async()=>{
      if(!nd.value){toast("Pick the new date.");return false}
      await writeItem("requests",S.meId,uid("r"),{type:"extend",task:ts.value,newDue:nd.value,reason:rs.value.trim(),at:now(),state:"pending"});toast("Request sent")},"Send request");return}
  const title=h("input",{type:"text",id:"rq-title",class:"big",required:true,maxlength:"200",placeholder:"Proposed task title","aria-label":"Title"});
  const desc=h("textarea",{id:"rq-desc",class:"plain",placeholder:"Why it's needed and what it will produce…","aria-label":"Description"});
  const due=h("input",{type:"date",id:"rq-ndue"});const pr=sel("rq-prio",PRIOS,"medium");const est=h("input",{type:"number",id:"rq-est",min:"0",step:"0.5"});
  openModal("Propose a task",[title,desc,h("div",{class:"form"},h("label",{},"Proposed due date",due),h("label",{},"Priority",pr),h("label",{},"Estimated hours",est))],async()=>{
    if(!title.value.trim()){toast("Write a title.");return false}
    await writeItem("requests",S.meId,uid("r"),{type:"new",title:title.value.trim(),desc:desc.value.trim(),due:due.value||null,priority:pr.value,estimate:est.value?parseFloat(est.value):null,at:now(),state:"pending"});toast("Proposal sent")},"Send proposal")}

/* ---------- export ---------- */
async function exportCsv(){
  const q=v=>'"'+String(v??"").replace(/"/g,'""')+'"';const num=n=>String(Math.round((+n||0)*10)/10);
  const rows=[["ID","Title","Description","Assigned to","Priority","Start","Due","Status","Progress %","Flag","Estimated hours","Hours logged","Goal","Created on"]].concat(scopeTasks().slice().sort(sortTasks).map(t=>{const r=riskOf(t);
    return[tid(t),t.title,t.desc,asg(t).map(nameOf).join("; "),PRIO_L[t.priority]||"",startOf(t),t.due||"",STATUS_L[statusOf(t)],Math.round(progressOf(t)*100),r?(r.level==="late"?"Overdue":"At risk"):"",t.estimate?num(t.estimate):"",num(loggedOf(t)),(goalOf(t.goal)||{}).title||"",(t.createdAt||"").slice(0,10)]}));
  saveBlob(new Blob(["\ufeff"+rows.map(r=>r.map(q).join(",")).join("\r\n")],{type:"text/csv;charset=utf-8"}),"task-fht-"+todayStr()+".csv")}

/* ---------- login & boot ---------- */
function showLogin(){$("#side").hidden=true;
  const em=h("input",{type:"email",id:"li-email",autocomplete:"username",required:true});const pw=h("input",{type:"password",id:"li-pw",autocomplete:"current-password",required:true});
  const err=h("div",{class:"err",role:"alert"});const btn=h("button",{class:"btn primary",type:"submit"},"Sign in");
  const form=h("form",{},h("label",{for:"li-email"},"Email",em),h("label",{for:"li-pw"},"Password",pw),err,btn);
  form.addEventListener("submit",async e=>{e.preventDefault();btn.disabled=true;err.textContent="";
    const{data,error}=await sb.auth.signInWithPassword({email:em.value.trim().toLowerCase(),password:pw.value});
    if(error){err.textContent=/invalid|credentials/i.test(error.message)?"Wrong email or password.":/banned/i.test(error.message)?"This account is deactivated.":error.message;btn.disabled=false;return}
    start(data.user)});
  $("#main").replaceChildren(h("div",{class:"login"},h("span",{class:"ws-logo"},"F"),h("h1",{},"FHT Tracker"),h("p",{},"Sign in with the email and password you received."),form,
    h("p",{class:"hint"},"Forgot your password? Ask the team lead to reset it.")));em.focus()}
function firstLogin(me){return new Promise(res=>{$("#side").hidden=true;
  const nm=h("input",{type:"text",id:"fl-name",value:me.name||"",required:true,autocomplete:"name"});
  const p1=h("input",{type:"password",id:"fl-pw1",autocomplete:"new-password",required:true});const p2=h("input",{type:"password",id:"fl-pw2",autocomplete:"new-password",required:true});
  const err=h("div",{class:"err",role:"alert"});const btn=h("button",{class:"btn primary",type:"submit"},"Save and continue");
  const form=h("form",{},h("label",{for:"fl-name"},"Full name",nm),h("label",{for:"fl-pw1"},"New password (at least 10 characters)",p1),h("label",{for:"fl-pw2"},"Repeat the password",p2),err,btn);
  form.addEventListener("submit",async e=>{e.preventDefault();err.textContent="";
    if(p1.value.length<10){err.textContent="The password must have at least 10 characters.";return}if(p1.value!==p2.value){err.textContent="The two passwords don't match.";return}
    btn.disabled=true;const{error}=await sb.auth.updateUser({password:p1.value});
    if(error){err.textContent=/same|different/i.test(error.message)?"Choose a password different from the temporary one.":error.message;btn.disabled=false;return}
    await sb.from("profiles").update({name:nm.value.trim(),must_change:false}).eq("id",me.id);res()});
  $("#main").replaceChildren(h("div",{class:"login"},h("span",{class:"ws-logo"},"F"),h("h1",{},"Welcome"),h("p",{},"Before you start, choose your own password."),form));nm.focus()})}
let started=false;
async function start(user){if(started)return;started=true;S.meId=user.id;S.db=DB;
  const{data:me,error}=await sb.from("profiles").select("*").eq("id",user.id).maybeSingle();
  if(error||!me||!me.active){started=false;await sb.auth.signOut();gate("Account not active","Your account isn't enabled. Contact the team lead.");return}
  if(me.must_change)await firstLogin(me);
  $("#side").hidden=false;$("#main").replaceChildren(h("div",{class:"gate"},h("h2",{},"Loading…")));
  await loadProfiles();S.f.mine=!S.isOwner;
  const onErr=e=>toast(errMsg(e));
  try{const ps=await DB.doc("prefs/"+S.meId).get();if(!ps.exists)await DB.doc("prefs/"+S.meId).set({joined:now(),remind:[1,3],weekly:true})}catch(e){}
  const listCol=(c,key)=>DB.collection(c).onSnapshot(s=>{S[key]=s.docs.map(d=>({...d.data(),id:d.id}));S.loaded.add(key);schedule()},onErr);
  const mapCol=c=>DB.collection(c).onSnapshot(s=>{const m={};s.docs.forEach(d=>m[d.id]=d.data());S[c]=m;S.loaded.add(c);schedule()},onErr);
  listCol("tasks","tasks");listCol("goals","goals");listCol("templates","templates");
  for(const c of["prefs","status","notes","files","work","requests"])mapCol(c);
  if(S.isOwner)mapCol("digests");
  sb.channel("fht-live").on("postgres_changes",{event:"*",schema:"public",table:"docs"},p=>{const c=(p.new&&p.new.col)||(p.old&&p.old.col);if(c&&SUBS[c])bump(c)})
    .on("postgres_changes",{event:"*",schema:"public",table:"profiles"},()=>loadProfiles()).subscribe();
  setInterval(()=>{Object.keys(SUBS).forEach(bump);loadProfiles()},60000);
  S.ready=true;renderSide();mountView()}
async function boot(){if(!sb){gate("Missing configuration","Set the Supabase project URL and key in config.js.");return}
  const{data:{session}}=await sb.auth.getSession();if(session&&session.user)start(session.user);else showLogin()}
boot().catch(e=>gate("Couldn't start the tracker",errMsg(e)));
</script>
